<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="game-container">
        <div class="btn-container">
                <button class="btn" id="rock">Rock</button>
                <button class="btn" id="paper">Paper</button>
                <button class="btn" id="scissors">Scissors</button>
        </div>
        <div class="screen-wrapper">
            <div class="screen-container">
                <div class="diagonal-line"></div>
                <div class="heart-container-player">
                    <img src="./images/heart-full.png" class="heart" id="heart1">
                    <img src="./images/heart-full.png" class="heart" id="heart2">
                    <img src="./images/heart-full.png" class="heart" id="heart3">
                    <img src="./images/heart-full.png" class="heart" id="heart4">
                    <img src="./images/heart-full.png" class="heart" id="heart5">
                </div>
                <div class="heart-container-computer">
                    <img src="./images/heart-full.png" class="heart" id="heart6">
                    <img src="./images/heart-full.png" class="heart" id="heart7">
                    <img src="./images/heart-full.png" class="heart" id="heart8">
                    <img src="./images/heart-full.png" class="heart" id="heart9">
                    <img src="./images/heart-full.png" class="heart" id="heart10">
                </div>
            </div>
            <div class="info-container">
                    <div class="info" id="humanChoice"></div>
                    <div class="info" id="score">0 - 0</div>
                    <div class="info" id="computerChoice"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
